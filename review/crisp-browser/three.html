<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ГРАНЬ · чёткая браузерная подача</title><style>body{margin:0;background:#f3f5f7;color:#17212e;font:14px system-ui}header{padding:20px 30px}h1{font-size:24px}button{background:white;border:1px solid #c5cedb;border-radius:7px;padding:10px 16px;margin:4px;cursor:pointer}iframe{width:100%;height:760px;border:0}</style><header><h1>ГРАНЬ · исходная подача и аккуратная доработка</h1><button data-p="0">Как на вашем скриншоте</button><button data-p="1">Мягкий архитектурный свет</button><button data-mode="day">День</button><button data-mode="night">Ночь</button></header><iframe src="../../index.html"></iframe><script src="lighting-base.js"></script><script src="palette-base.js"></script><script>
const frame=document.querySelector('iframe');let selected=0,mode='day';window.ready=false;
window.applyStudy=()=>{const w=frame.contentWindow;w.setFiveLighting(0,mode);if(selected===1)w.eval(`(()=>{const v=modalViewer;v.lighting.hemisphere.intensity=${mode==='day'?'.92':'.40'};v.lighting.fill.intensity=${mode==='day'?'.32':'.22'};v.sun.shadow.radius=11;v.sun.shadow.blurSamples=6;v.p.root.traverse(o=>{for(const m of [].concat(o.material||[])){if(m.envMap){m.roughness=.3;m.envMapIntensity=.32;if(m.emissive)m.emissiveIntensity=${mode==='day'?'0':'.62'};}}});v.r.toneMappingExposure=${mode==='day'?'.99':'.9'};v.r.shadowMap.needsUpdate=true;v.r.render(v.scene,v.cam);})();`)};
frame.onload=()=>{frame.contentDocument.querySelector('[data-open="0"]').click();frame.contentWindow.eval('('+installLightingPreview.toString()+')()');frame.contentWindow.eval('('+installFiveLighting.toString()+')()');window.ready=true;applyStudy()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{selected=+b.dataset.p;applyStudy()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;applyStudy()});
</script></html>
