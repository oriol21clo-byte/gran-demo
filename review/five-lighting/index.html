<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ГРАНЬ · пять вариантов дня и ночи</title><style>body{margin:0;background:#f3f5f7;color:#17212e;font:14px system-ui}header{padding:20px 32px}h1{font-size:24px;margin:0 0 12px}p{color:#5d6c7c;margin:12px 0}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #c7d1dd;border-radius:7px;background:#fff;color:#17212e;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#17212e;color:white}.modes{margin-top:12px}iframe{display:block;width:100%;height:760px;border:0}small{color:#627284}</style><header><h1>ГРАНЬ · пять пар «День / Ночь»</h1><nav id="palettes"><button data-p="0">01 · Серебро и графит</button><button data-p="1">02 · Небо и индиго</button><button data-p="2">03 · Тёплый камень</button><button data-p="3">04 · Скандинавский свет</button><button data-p="4">05 · Архитектурная галерея</button></nav><nav class="modes"><button data-mode="day">День</button><button data-mode="night">Ночь</button></nav><p><small>Браузерный Three.js. Одинаковые модель и ракурс, градиентный фон, мягкие тени, тёплые окна. Без bloom и новых карт теней.</small></p></header><iframe src="../../index.html" title="Модель проекта"></iframe><script src="../visual-options/lighting.js"></script><script src="presets.js"></script><script>
const frame=document.querySelector('iframe');let palette=0,mode='day';window.ready=false;
function update(){if(!window.ready)return;frame.contentWindow.setFiveLighting(palette,mode);document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.p===palette)));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}
frame.onload=()=>{frame.contentDocument.querySelector('[data-open="0"]').click();frame.contentWindow.eval('('+installLightingPreview.toString()+')()');frame.contentWindow.eval('('+installFiveLighting.toString()+')()');window.ready=true;update()};document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{palette=+b.dataset.p;update()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;update()});
</script></html>
