<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ГРАНЬ · браузерное сопоставление</title><style>body{margin:0;background:#f3f5f7;font:14px system-ui;color:#17212e}header{padding:20px 32px}h1{font-size:22px}button{padding:10px 20px;margin-right:8px;border:1px solid #c5cfda;background:white;border-radius:7px;cursor:pointer}iframe{width:100%;height:960px;border:0}</style><header><h1>Three.js · браузерное сопоставление с Blender</h1><p>Это реальный браузерный рендер. Он не воспроизводит физические переотражения Cycles.</p><button data-mode="day">День</button><button data-mode="night">Ночь</button></header><iframe src="../../index.html"></iframe><script src="../visual-options/lighting.js"></script><script src="browser-match.js"></script><script>const f=document.querySelector('iframe');window.ready=false;f.onload=()=>{f.contentDocument.querySelector('[data-open="0"]').click();f.contentWindow.eval('('+installLightingPreview.toString()+')()');f.contentWindow.eval('('+installBrowserStudy.toString()+')()');window.ready=true};document.querySelectorAll('button').forEach(b=>b.onclick=()=>f.contentWindow.setBrowserStudy(b.dataset.mode));</script></html>
